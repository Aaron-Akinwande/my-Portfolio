[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Netlify's Next.js adapter. It is added automatically only for sites that were
# created as Next.js sites; this one started as a Vite site, so it is declared
# here. Without it, the raw .next folder is published and every route is a 404.
[[plugins]]
  package = "@netlify/plugin-nextjs"
